# SwiftLint config for the iOS app, GeckoKit, and NSE.
# Tuned to this codebase's conventions so the linter surfaces real problems
# rather than style noise:
#  - short local names (e, c, jid, me) are idiomatic here
#  - a couple of types are naturally large (AppModel, the event dispatcher)
#  - trailing commas in multi-line literals are intentional (clean diffs)
# The bug-catching rules (unused bindings/params, force casts, etc.) stay on.

# Restrict discovery to code owned by this repository. The checkout also holds
# multi-gigabyte generated dependency/build trees; recursively walking the repo
# root can overflow SwiftLint's file collector before linting begins.
included:
  - ios/app/Sources
  - ios/app/GeckoKit/Package.swift
  - ios/app/GeckoKit/Sources
  - ios/app/GeckoKit/Tests
  - ios/nse

excluded:
  - "**/.build"      # SwiftPM build dir (GeckoKit) — generated sources
  - "**/.swiftpm"

disabled_rules:
  - identifier_name
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - implicit_optional_initialization
  - trailing_comma
  - todo
  - large_tuple                            # labeled 3-tuples (e.g. dir triples) are fine
  - multiple_closures_with_trailing_closure # fights SwiftUI .sheet(onDismiss:){ } etc.

line_length:
  warning: 140
  error: 200
