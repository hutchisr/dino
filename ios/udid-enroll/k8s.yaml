# Self-hosted iOS UDID enrollment service (Apple OTA Profile Service).
#
# Public HTTPS on enroll.anemoneya.me via the nginx ingress + cert-manager
# (Let's Encrypt). iOS requires the Profile Service URL to use a CA-trusted
# cert — Let's Encrypt qualifies, so no extra trust setup on the device.
#
# Before applying: point DNS for enroll.anemoneya.me at the nginx ingress
# (same target as your other *.anemoneya.me records, e.g. 144.202.116.122 /
# the AAAA), so cert-manager can complete the HTTP-01 challenge.
#
# Read collected UDIDs with:
#   kubectl -n gecko logs deploy/gecko-udid-enroll -f | grep ENROLL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gecko-udid-enroll
  namespace: gecko
  labels:
    app: gecko-udid-enroll
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gecko-udid-enroll
  template:
    metadata:
      labels:
        app: gecko-udid-enroll
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: enroll
          image: lax.vultrcr.com/mercury/gecko-udid-enroll:v3
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: tls          # domain cert+key, to CMS-sign the profile
              mountPath: /tls
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
      volumes:
        - name: tls
          secret:
            secretName: gecko-enroll-tls
---
apiVersion: v1
kind: Service
metadata:
  name: gecko-udid-enroll
  namespace: gecko
  labels:
    app: gecko-udid-enroll
spec:
  selector:
    app: gecko-udid-enroll
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gecko-udid-enroll
  namespace: gecko
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-nginx
    cert-manager.io/private-key-algorithm: ECDSA
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - enroll.anemoneya.me
      secretName: gecko-enroll-tls
  rules:
    - host: enroll.anemoneya.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gecko-udid-enroll
                port:
                  number: 80
