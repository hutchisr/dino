server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # iOS OTA install needs the manifest served as XML and the IPA as a binary
    # download; force those content types regardless of nginx's mime guesses.
    location ~ \.plist$ {
        types { }
        default_type application/xml;
    }
    location ~ \.ipa$ {
        types { }
        default_type application/octet-stream;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
